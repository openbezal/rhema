name: Validate

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"
  RUST_VERSION: "1.94.0"
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint --max-warnings 0
      - run: bun run typecheck
      - run: bun run verify:typecheck
      - run: bun run test --run
      - run: bun run build

  web:
    name: Web lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint --max-warnings 0

  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install data-tool test dependencies
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Validate Bible data tools on this platform
        working-directory: .
        run: bun run test --run data/
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
            libasound2-dev libudev-dev cmake clang libclang-dev
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clangDirectory = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$clangDirectory\libclang.dll")) {
            throw 'The Windows runner is missing LLVM/libclang.'
          }
          "LIBCLANG_PATH=$clangDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
      - name: Create compile-time SQLite fixture
        working-directory: .
        run: |
          bun -e 'import { Database } from "bun:sqlite"; const db = new Database("data/rhema.db", { create: true }); db.close();'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Test without local Whisper
        run: cargo test --workspace --no-default-features --locked
