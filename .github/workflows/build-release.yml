name: Build, Bundle and Release

on:
  push:
    branches:
      - chore/cicd-release-pipeline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
 
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            patchelf

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare application assets
        run: |
          bun run setup:bundle

      - name: Pre-build Rust (workaround for whisper-rs-sys env issue)
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing (optional)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Auto-updater signing (optional)
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: Rhema ${{ steps.stage.outputs.version }} (nightly)
          releaseBody: |
            releaseBody: |
            Automated ${{ matrix.target }} build of Rhema.

            | | |
            |---|---|
            | Version | `${{ steps.stage.outputs.version }}` |
            | Platform | `${{ matrix.target }}` |
            | Commit | [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
            | Size | ${{ steps.stage.outputs.size_mb }} MB |
            | SHA-256 | `${{ steps.stage.outputs.sha256 }}` |

            ### Installation

            Download the installer for your platform from the assets below.

            The installer is currently **unsigned**, so your operating system may display a security warning on first launch.

            ### Included

            - Bible database
            - Bible verse detection
            - Desktop application

            See the README for setup and usage instructions.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}