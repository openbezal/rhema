name: Build, Bundle and Release

on:
  push:
    branches:
      - chore/cicd-release-pipeline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macOS Apple Silicon

          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: Linux x64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: Windows x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libudev-dev \
            patchelf

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Prepare application assets
        run: bun run setup:bundle

      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Rhema version: $VERSION"

      - name: Pre-build Rust (workaround for whisper-rs-sys env issue)
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

          # Tauri build only — release creation happens in the release job.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing (optional)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Auto-updater signing (optional)
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          args: --target ${{ matrix.target }}

      # ---------------------------------------------------------------
      # Collect the distributable files produced by Tauri.
      # ---------------------------------------------------------------

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist

          find "src-tauri/target/${{ matrix.target }}/release/bundle" \
            -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) \
            -exec cp {} dist/ \;

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist

          find "src-tauri/target/${{ matrix.target }}/release/bundle" \
            -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} dist/ \;

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Get-ChildItem `
            -Path "src-tauri\target\${{ matrix.target }}\release\bundle" `
            -Recurse `
            -File |
            Where-Object {
              $_.Extension -in ".exe", ".msi"
            } |
            Copy-Item -Destination dist

      - name: List collected artifacts
        shell: bash
        run: |
          echo "Collected artifacts:"
          ls -lh dist

      # ---------------------------------------------------------------
      # Calculate SHA-256 and file sizes.
      # ---------------------------------------------------------------

      - name: Generate artifact metadata
        shell: bash
        run: |
          echo "${{ steps.version.outputs.version }}" > dist/version.txt

          echo "# ${{ matrix.platform }}" > dist/checksums.txt
          echo "" >> dist/checksums.txt

          echo "# ${{ matrix.platform }}" > dist/sizes.txt
          echo "" >> dist/sizes.txt

          for file in dist/*; do
            if [[ -f "$file" ]] &&
               [[ "$file" != "dist/version.txt" ]] &&
               [[ "$file" != "dist/checksums.txt" ]] &&
               [[ "$file" != "dist/sizes.txt" ]]; then

              filename=$(basename "$file")

              if command -v sha256sum >/dev/null 2>&1; then
                sha256=$(sha256sum "$file" | awk '{print $1}')
              else
                sha256=$(shasum -a 256 "$file" | awk '{print $1}')
              fi

              if command -v stat >/dev/null 2>&1; then
                if [[ "$RUNNER_OS" == "macOS" ]]; then
                  size_bytes=$(stat -f "%z" "$file")
                else
                  size_bytes=$(stat -c "%s" "$file")
                fi
              fi

              size_mb=$(awk "BEGIN {printf \"%.2f\", $size_bytes / 1024 / 1024}")

              echo "$sha256  $filename" >> dist/checksums.txt
              echo "$filename|$size_mb MB|$sha256" >> dist/sizes.txt
            fi
          done

          echo ""
          echo "Checksums:"
          cat dist/checksums.txt

          echo ""
          echo "Sizes:"
          cat dist/sizes.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhema-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # =====================================================================
  # RELEASE
  # =====================================================================

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rhema-*
          path: artifacts
          merge-multiple: false

      - name: Inspect downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -maxdepth 3 -print

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(find artifacts -name version.txt -type f | head -1 | xargs cat)

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine Rhema version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Rhema version: $VERSION"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          find artifacts \
            -type f \
            \( \
              -name "*.dmg" \
              -o -name "*.AppImage" \
              -o -name "*.deb" \
              -o -name "*.rpm" \
              -o -name "*.exe" \
              -o -name "*.msi" \
              -o -name "*.tar.gz" \
              -o -name "*.sig" \
            \) \
            -exec cp {} release-assets/ \;

          echo "Release assets:"
          ls -lh release-assets

      - name: Generate release metadata
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          {
            echo "## Rhema v${VERSION}"
            echo ""
            echo "Automated nightly build of Rhema."
            echo ""
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo ""
            echo "### Downloads"
            echo ""
            echo "| Platform | File | Size | SHA-256 |"
            echo "|---|---|---:|---|"

            for metadata in artifacts/*/sizes.txt; do
              platform=$(head -1 "$metadata" | sed 's/^# //')

              tail -n +3 "$metadata" | while IFS='|' read -r filename size sha256; do
                if [[ -n "$filename" ]]; then
                  echo "| $platform | \`$filename\` | $size | \`$sha256\` |"
                fi
              done
            done

            echo ""
            echo "### Installation"
            echo ""
            echo "Download the installer for your platform from the assets below."
            echo ""
            echo "The installer is currently **unsigned**, so your operating system may display a security warning on first launch."
            echo ""
            echo "### Included"
            echo ""
            echo "- Bible database"
            echo "- Bible verse detection"
            echo "- Desktop application"
            echo ""
            echo "See the README for setup and usage instructions."

          } > release-notes.md

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Rhema v${{ steps.version.outputs.version }} (nightly)
          body_path: release-notes.md
          draft: true
          prerelease: false
          files: release-assets/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}